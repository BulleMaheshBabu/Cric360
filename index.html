<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1326" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cric360" />
<meta name="description" content="Live cricket scoring, player auctions, and match tracking — installable as a web app." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>Cric360</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1326;--card:rgba(30,41,59,.88);--border:rgba(56,189,248,.28);
  --text:#e8eefc;--muted:#a8b4c8;--primary:#38bdf8;--primary-bright:#7dd3fc;
  --ok:#00e676;--danger:#f43f5e;--sec:#1e293b;
  --accent-auction:#38bdf8;--accent-live:#00e676;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;min-height:100dvh}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:
    radial-gradient(900px 480px at 12% -8%,rgba(14,165,233,.18),transparent 55%),
    radial-gradient(700px 400px at 95% 8%,rgba(0,230,118,.1),transparent 50%),
    #0f172a;
  color:var(--text);line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:440px;margin:0 auto;
  padding:max(12px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));
  min-height:100dvh;display:flex;flex-direction:column;
}
.panel{
  flex:1;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:20px 16px 22px;box-shadow:0 16px 48px rgba(0,0,0,.4);
  backdrop-filter:blur(16px);
}
.hidden{display:none!important}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);border:0;
}

/* Brand */
.brand{
  font-family:'Space Grotesk','Plus Jakarta Sans',system-ui,sans-serif;
  font-size:1.5rem;font-weight:700;letter-spacing:-.03em;margin:0;
  background:linear-gradient(90deg,#e0f2fe,#38bdf8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand:focus{outline:none}
.brand:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:6px}

/* Auth screen */
.auth-hero{text-align:center;padding:8px 4px 0}
.logo-row{
  display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 14px;
}
.logo-mark{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;line-height:1;
  background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.35);
  box-shadow:0 4px 20px rgba(14,165,233,.25);
}
.auth-hero .brand{font-size:1.85rem}
.welcome{
  margin:0 0 8px;font-size:15px;font-weight:600;line-height:1.55;color:var(--text);
  text-align:center;
}
.welcome-sub{
  margin:0 0 20px;font-size:13px;font-weight:500;line-height:1.5;color:var(--muted);
  text-align:center;
}
.emoji{font-style:normal}

/* Google sign-in chip button */
.btn-google{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;min-height:54px;padding:12px 18px;margin:0;
  border-radius:14px;border:1px solid rgba(255,255,255,.18);
  background:#fff;color:#1f1f1f;
  font-family:inherit;font-size:16px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.25);
  -webkit-appearance:none;appearance:none;
}
.btn-google:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.btn-google:active{transform:scale(.98)}
.g-icon{
  width:22px;height:22px;flex-shrink:0;
  display:block;
}
#authError{color:var(--danger);font-weight:600;min-height:1.3em;margin:12px 0 0;text-align:center;font-size:14px}

/* Hub: slim top bar, launch keys centered */
#screenHub.panel{
  background:
    linear-gradient(180deg,rgba(14,165,233,.12) 0%,transparent 28%),
    linear-gradient(180deg,transparent 60%,rgba(0,230,118,.08) 100%),
    rgba(15,23,42,.92);
  border-color:rgba(56,189,248,.22);
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0;min-height:44px;flex-shrink:0;
}
.user-pill{
  border:none;cursor:pointer;font:inherit;appearance:none;-webkit-appearance:none;
  display:inline-flex;align-items:center;gap:8px;max-width:55%;
  padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.4);color:var(--primary-bright);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.user-pill:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.user-pill .dot{
  width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;
  box-shadow:0 0 8px var(--ok);
}

/* Centered vertical launch keys */
.hub-center{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;padding:12px 4px 8px;min-height:0;
}
.app-tile{
  display:flex;flex-direction:row;align-items:center;justify-content:flex-start;
  gap:16px;width:100%;max-width:340px;
  min-height:88px;padding:16px 18px;
  border-radius:20px;border:none;
  color:#fff;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:800;
  letter-spacing:-.01em;text-align:left;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
  -webkit-appearance:none;appearance:none;
  touch-action:manipulation;
  transition:transform .12s ease,box-shadow .12s ease;
}
.app-tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
.app-tile:active{transform:scale(.97)}
.app-tile .tile-icon{
  width:56px;height:56px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;line-height:1;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.app-tile .tile-label{
  flex:1;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.2);
}
.app-tile .tile-chevron{
  flex-shrink:0;font-size:22px;opacity:.85;font-weight:700;
}

/* Distinct colorful boxes */
.tile-auction{
  background:linear-gradient(135deg,#0ea5e9 0%,#0369a1 55%,#1e3a8a 100%);
  box-shadow:0 12px 32px rgba(14,165,233,.45);
}
.tile-live{
  background:linear-gradient(135deg,#34d399 0%,#059669 50%,#047857 100%);
  box-shadow:0 12px 32px rgba(16,185,129,.42);
}

.hub-hint{
  margin:4px 0 0;text-align:center;font-size:12px;font-weight:600;color:var(--muted);
  flex-shrink:0;
}

/* Install (secondary) */
.install-row{
  margin-top:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.btn-install{
  min-height:44px;padding:10px 16px;border-radius:999px;
  border:1px solid var(--border);background:rgba(56,189,248,.12);
  color:var(--primary-bright);font:inherit;font-size:13px;font-weight:700;
  cursor:pointer;-webkit-appearance:none;appearance:none;
}
.btn-install:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

#screenBoot{justify-content:center;align-items:center;text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <section id="screenBoot" class="panel" role="status" aria-live="polite">
    <p style="font-weight:700;margin:0">Starting…</p>
  </section>

  <!-- ===== Sign-in ===== -->
  <section id="screenAuth" class="panel hidden" role="region" aria-labelledby="authTitle">
    <div class="auth-hero">
      <div class="logo-row">
        <span class="logo-mark" aria-hidden="true">🏏</span>
        <h1 id="authTitle" class="brand" tabindex="-1">Cric360</h1>
      </div>
      <p class="welcome">
        We can’t wait for you to try our powerful cricketing apps — all in one place!
        <span class="emoji" aria-hidden="true"> 🏏⚡</span>
      </p>
      <p class="welcome-sub">
        Sign in to watch and run your auctions, view matches, and broadcast your cricketing action.
        <span class="emoji" aria-hidden="true"> 🎯📢</span>
      </p>
    </div>

    <button type="button" id="btnGoogle" class="btn-google" aria-label="Continue with Google">
      <svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div id="installAuthWrap" class="install-row hidden">
      <button type="button" id="btnInstallAuth" class="btn-install" aria-label="Install Cric360 on this device">Install app</button>
    </div>
    <p id="authError" role="alert"></p>
  </section>

  <!-- ===== Home (after sign-in) ===== -->
  <section id="screenHub" class="panel hidden" role="region" aria-labelledby="hubTitle">
    <div class="topbar">
      <h1 id="hubTitle" class="brand" tabindex="-1">Cric360</h1>
      <button type="button" class="user-pill" id="userPill" aria-label="Signed in. Double tap to sign out.">
        <span class="dot" aria-hidden="true"></span>
        <span id="hubSub">Signed in</span>
      </button>
    </div>

    <div class="hub-center" role="group" aria-label="Apps">
      <button type="button" class="app-tile tile-auction" id="btnAuction"
              aria-label="Auction Tracker 360">
        <span class="tile-icon" aria-hidden="true">🔨</span>
        <span class="tile-label">Auction Tracker 360</span>
        <span class="tile-chevron" aria-hidden="true">›</span>
      </button>
      <button type="button" class="app-tile tile-live" id="btnLive"
              aria-label="Cric360 Live">
        <span class="tile-icon" aria-hidden="true">🏏</span>
        <span class="tile-label">Cric360 Live</span>
        <span class="tile-chevron" aria-hidden="true">›</span>
      </button>
      <p class="hub-hint" id="hubHint">Tap an app to open</p>
    </div>

    <div id="installHubWrap" class="install-row hidden">
      <button type="button" id="btnInstall" class="btn-install" aria-label="Install Cric360 on this device">Install app</button>
    </div>
  </section>
</main>

<div id="hubLive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBGaYN7aDiO10yOUOr2deRamH5ed1Jon30",
  authDomain: "auctiontracker360.firebaseapp.com",
  projectId: "auctiontracker360",
  storageBucket: "auctiontracker360.firebasestorage.app",
  messagingSenderId: "1035286573847",
  appId: "1:1035286573847:web:3cc9d7df3617f6fb787d52",
  measurementId: "G-MTYE09EDSY"
};
const SUPER_ADMIN = "maheshdhoni7633@gmail.com";
let auth;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (pe) {}
} catch (e) {
  document.getElementById('screenBoot').innerHTML =
    '<p style="color:#f43f5e;text-align:center;font-weight:700;margin:0">Could not start. Check connection and refresh.</p>';
}

function $(id){ return document.getElementById(id); }
function show(id){
  ['screenBoot','screenAuth','screenHub'].forEach(function(s){ $(s).classList.add('hidden'); });
  $(id).classList.remove('hidden');
}
function announce(msg){
  var el = $('hubLive');
  if(!el) return;
  el.textContent = '';
  setTimeout(function(){ el.textContent = msg || ''; }, 30);
}
function friendlyAuthError(e){
  if(!e) return 'Sign-in failed. Please try again.';
  var c = e.code || '';
  if(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return 'Sign-in was cancelled.';
  if(c === 'auth/popup-blocked') return 'Pop-up was blocked. Trying full-screen sign-in.';
  if(c === 'auth/unauthorized-domain') return 'This website is not allowed for Google sign-in yet. Ask the admin to allow the domain.';
  if(c === 'auth/network-request-failed') return 'Network error. Check your connection and try again.';
  return 'Could not sign in. Please try again.';
}
function googleProvider(){
  var provider = new firebase.auth.GoogleAuthProvider();
  try { provider.setCustomParameters({ prompt: 'select_account' }); } catch (x) {}
  return provider;
}

$('btnGoogle').onclick = async function(){
  $('authError').textContent = '';
  announce('Opening Google accounts for Cric360.');
  try {
    await auth.signInWithPopup(googleProvider());
  } catch (e) {
    var msg = friendlyAuthError(e);
    if (e && e.code === 'auth/popup-blocked') {
      try {
        announce('Opening full-screen sign-in for Cric360.');
        await auth.signInWithRedirect(googleProvider());
        return;
      } catch (e2) { msg = friendlyAuthError(e2); }
    }
    $('authError').textContent = msg;
    announce(msg);
  }
};

function confirmSignOut(){
  if(!confirm('Sign out of Cric360?')) return;
  announce('Signing out.');
  auth.signOut();
}
if($('userPill')) $('userPill').onclick = confirmSignOut;

/* App tiles = buttons, not links */
$('btnAuction').onclick = function(){
  announce('Opening Auction Tracker 360.');
  window.location.href = 'auctiontracker360.html';
};
$('btnLive').onclick = function(){
  announce('Opening Cric360 Live.');
  window.location.href = 'cric360live.html';
};

auth.onAuthStateChanged(function(u){
  if (!u) {
    show('screenAuth');
    setTimeout(function(){ try{ $('authTitle').focus(); }catch(e){} }, 40);
    return;
  }
  var admin = (u.email || '').toLowerCase() === SUPER_ADMIN;
  var short = admin ? 'Admin' : ((u.email || 'User').split('@')[0]);
  $('hubSub').textContent = short;
  var lab = (admin ? 'Signed in as admin. ' : ('Signed in as ' + (u.email || 'user') + '. ')) + 'Double tap to sign out.';
  $('userPill').setAttribute('aria-label', lab);
  show('screenHub');
  setTimeout(function(){ try{ $('hubTitle').focus(); }catch(e){} }, 40);
});

/* PWA install */
var deferredPrompt = null;
function showInstall(on){
  ['installAuthWrap','installHubWrap'].forEach(function(id){
    var el = $(id);
    if(el) el.classList.toggle('hidden', !on);
  });
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  showInstall(true);
});
window.addEventListener('appinstalled', function(){
  deferredPrompt = null;
  showInstall(false);
  announce('Cric360 installed. Open it from your home screen.');
});
function runInstall(){
  return async function(){
    if (!deferredPrompt) {
      announce('Install is not available right now.');
      return;
    }
    deferredPrompt.prompt();
    var choice = await deferredPrompt.userChoice.catch(function(){ return {}; });
    if (choice && choice.outcome === 'accepted') announce('Installing Cric360…');
    deferredPrompt = null;
    showInstall(false);
  };
}
if ($('btnInstall')) $('btnInstall').addEventListener('click', runInstall());
if ($('btnInstallAuth')) $('btnInstallAuth').addEventListener('click', runInstall());
</script>
</body>
</html>
